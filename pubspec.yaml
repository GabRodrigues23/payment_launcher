name: payment_launcher
description: "Payment Laucher to integrates with TEFIP"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.0
  get_it: ^9.2.1
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/home_animation.json
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/montserrat/static/Montserrat-Bold.ttf
        - asset: assets/fonts/montserrat/static/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Italic-VariableFont_wght.ttf